name: Platform checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    env:
      KOMISIO_INTAKE_ENABLED: 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start isolated local Supabase with test inbox
        run: |
          node scripts/prepare-local.mjs
          # The Supabase GHCR mirror does not publish this maintenance version.
          rest_version=$(cat supabase/.temp/rest-version)
          docker pull "postgrest/postgrest:${rest_version}"
          docker tag "postgrest/postgrest:${rest_version}" "ghcr.io/supabase/postgrest:${rest_version}"
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector > /dev/null
      - run: node scripts/configure-local.mjs
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:db
      - run: npm run test:concurrency
      - run: npm run test:mcp
      - run: npm run test:seller-photos
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:assistance
      - run: npm run test:zettle-automation
      - name: Stop local services
        if: always()
        run: supabase stop

  staging-migrations:
    needs: platform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-database
    concurrency:
      group: staging-database-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Apply and verify committed staging migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: node scripts/migrate-staging.mjs
      - name: Trigger the application deployment after the database
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "No deploy hook configured; Vercel deploys on push."
            exit 0
          fi
          case "$VERCEL_DEPLOY_HOOK_URL" in
            https://api.vercel.com/v1/integrations/deploy/*) ;;
            *) echo "VERCEL_DEPLOY_HOOK_URL is not a Vercel deploy hook"; exit 1 ;;
          esac
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" -o /dev/null
          echo "Deploy hook fired for $GITHUB_SHA"
