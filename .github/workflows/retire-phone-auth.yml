name: Retire phone authentication
on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment with verified email-based central intake deployed
        required: true
        type: choice
        options: [staging, production]
permissions:
  contents: read
jobs:
  retire:
    if: github.ref == 'refs/heads/main' && github.repository == 'Komisio/komisio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.target == 'production' && 'production-database' || 'staging-database' }}
    concurrency:
      group: retire-phone-auth-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Disable phone provider and SMS hook, preserve other Auth settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          AUTH_TARGET: ${{ inputs.target }}
        run: node scripts/retire-phone-auth.mjs "$AUTH_TARGET"
