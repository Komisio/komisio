name: Platform checks

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platform:
    env:
      KOMISIO_INTAKE_ENABLED: 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start isolated local Supabase with test inbox
        run: |
          node scripts/prepare-local.mjs
          # The Supabase GHCR mirror does not publish this maintenance version.
          rest_version=$(cat supabase/.temp/rest-version)
          docker pull "postgrest/postgrest:${rest_version}"
          docker tag "postgrest/postgrest:${rest_version}" "ghcr.io/supabase/postgrest:${rest_version}"
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector > /dev/null
      - run: node scripts/configure-local.mjs
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:db
      - run: npm run test:concurrency
      - run: npm run test:mcp
      - run: npm run test:seller-photos
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=list
      - run: npm run test:assistance
      - run: npm run test:zettle-automation
      - run: npm run test:fortnox-automation
      - name: Redact credential headers from failure evidence
        id: redact
        if: failure()
        run: node scripts/redact-test-artifacts.mjs test-results
      # Fail closed: evidence is uploaded only after the redaction succeeded.
      - name: Preserve browser failure evidence
        if: failure() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            test-results/**/error-context.md
            test-results/**/test-failed-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop local services
        if: always()
        run: supabase stop

  staging-migrations:
    needs: platform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-database
    concurrency:
      group: staging-database-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Apply and verify committed staging migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: node scripts/migrate-staging.mjs
      - name: Configure localized confirmation emails
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: node scripts/configure-auth-emails.mjs staging
      # Vercel builds this same commit in parallel, but the staging project's
      # Deployment Checks require BOTH platform and staging-migrations before
      # promoting it. Keep these job names stable and do not bypass the checks.
      - name: Record staging release readiness
        run: echo "Staging database ready for $GITHUB_SHA; Vercel promotion requires both release checks."
